name: Build, Push and Deploy
# 1. construit l'image du site et la publie sur ghcr.io/aust-1/documentation ;
# 2. déploie : la clé SSH de ce dépôt est bridée sur le serveur à une seule commande,
#    « sudo opt-deploy documentation », qui avance le sous-module, tire la nouvelle image et attend
#    le healthcheck. Mécanisme et mise en place : docs/ci-deploy.md du dépôt opt ;
# 3. vérifie que le site sert bien ce commit (/revision.txt, écrit au build de l'image).
# Secrets requis (Settings → Secrets and variables → Actions) :
#   VPS_HOST         IP ou nom du VPS
#   VPS_SSH_KEY      clé privée dédiée à ce dépôt (autorisée par deploy-install.sh --key documentation)
#   VPS_KNOWN_HOSTS  clé d'hôte du serveur, épinglée (jamais de confiance à la première clé vue)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Pas d'annulation : interrompre un déploiement en cours laisserait le serveur entre deux états.
concurrency:
  group: "docs-deploy"
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute build date
        id: meta
        run: echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./site
          file: ./docker/Dockerfile
          target: serve
          push: true
          # L'étiquette SHA est celle que déploie le serveur (DOCS_TAG) ; latest ne suit que main.
          tags: |
            ghcr.io/${{ github.repository_owner }}/documentation:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/documentation:latest', github.repository_owner) || '' }}
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    # Le serveur déploie toujours origin/main : un build lancé à la main sur une autre branche n'est pas déployé.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    env:
      SITE_URL: https://docs.eliott-roussille.fr
    steps:
      - name: Déployer (clé bridée à « opt-deploy documentation » sur le VPS)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_KNOWN_HOSTS" || { echo "Secret VPS_KNOWN_HOSTS manquant" >&2; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts
          ssh -T -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "gh-deploy@$VPS_HOST"

      # Le site publie le commit dont il est construit (/revision.txt, écrit au build de l'image) :
      # on vérifie que c'est bien celui-ci qui est en ligne, et non une autre image « latest ».
      - name: Vérifier la version en ligne
        run: |
          for attempt in $(seq 1 12); do
            served="$(curl -fsS --max-time 10 "$SITE_URL/revision.txt" || true)"
            if [ "$served" = "$GITHUB_SHA" ]; then
              echo "En ligne : $served"
              exit 0
            fi
            sleep 5
          done
          echo "::error::$SITE_URL sert « ${served:-?} » au lieu de $GITHUB_SHA"
          exit 1
