# Site statique (Docusaurus + nginx). Image publiée par .github/workflows/build-and-deploy.yml
# (ghcr.io/aust-1/documentation) ; ce compose ne construit rien : opt-deploy (app-deploy.sh) la tire et la lance.
name: documentation

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  documentation:
    # Étiquette = SHA du commit déployé (DOCS_TAG, exporté au déploiement) ; latest à défaut.
    # Retour arrière : DOCS_TAG=<sha d'un commit précédent>, voir README (Déploiement).
    image: ghcr.io/aust-1/documentation:${DOCS_TAG:-latest}
    restart: unless-stopped
    # nginx-unprivileged : utilisateur 101, port 8080, fichiers temporaires et pid dans /tmp
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      proxy:
        aliases:
          - documentation # cible du reverse_proxy dans ./Caddyfile
    # healthcheck : défini dans l'image (HEALTHCHECK de docker/Dockerfile)
    logging: *logging

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
